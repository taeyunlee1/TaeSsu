<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100 Days With You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>100 Days With You ❤️</h1>
    <p class="message">Every day with you has been a blessing. Here's to the first 100, and many more to come.</p>
    
    <div id="milestone">
      <h2>We’ve been together for:</h2>
      <p id="daysTogether"></p>
    </div>

    <div class="gallery">
      <img src="images/photo1.jpg" alt="memory 1">
      <img src="images/photo2.jpg" alt="memory 2">
      <!-- Add more photos -->
    </div>

    <audio controls autoplay loop>
      <source src="audio/your-song.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
